<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="offset" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patterns -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="30" cy="0" r="1" fill="#334155" fill-opacity="0.5"/>
    </pattern>

    <style>
      .pulse-fast {
        animation: pulse 2.5s ease-in-out infinite alternate;
      }
      .pulse-slow {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8, 12;
        animation: dash 25s linear infinite;
      }
      .dash-flow-rev {
        stroke-dasharray: 6, 10;
        animation: dash-reverse 20s linear infinite;
      }
      .float-node-1 {
        animation: float1 6s ease-in-out infinite;
      }
      .float-node-2 {
        animation: float2 7s ease-in-out infinite;
      }
      .float-node-3 {
        animation: float3 5.5s ease-in-out infinite;
      }
      .core-spin {
        transform-origin: 940px 180px;
        animation: spin 30s linear infinite;
      }
      .core-spin-rev {
        transform-origin: 940px 180px;
        animation: spin-reverse 20s linear infinite;
      }
      .beacon-ring {
        transform-origin: 940px 180px;
        animation: beacon 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes dash-reverse {
        to {
          stroke-dashoffset: 1000;
        }
      }
      @keyframes pulse {
        0% {
          opacity: 0.35;
          transform: scale(0.97);
        }
        100% {
          opacity: 0.95;
          transform: scale(1.03);
        }
      }
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-8px) translateX(4px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(7px) translateX(-5px); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px) translateX(0px); }
        50% { transform: translateY(-6px) translateX(-4px); }
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin-reverse {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes beacon {
        0% {
          r: 25;
          opacity: 0.8;
        }
        100% {
          r: 95;
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="url(#coreGlow)" opacity="0.4" />
  <circle cx="940" cy="180" r="220" fill="url(#coreGlow)" opacity="0.8" />
  <circle cx="650" cy="300" r="130" fill="url(#coreGlow)" opacity="0.3" />

  <!-- Border Highlight -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- ==================== RIGHT SIDE: KNOWLEDGE GRAPH VISUALIZATION ==================== -->
  <g id="knowledge-graph">
    <!-- Center Core Energy Rings -->
    <circle class="beacon-ring" cx="940" cy="180" r="30" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle class="beacon-ring" cx="940" cy="180" r="30" fill="none" stroke="#a855f7" stroke-width="1.5" style="animation-delay: 1.5s;" />

    <!-- Rotating Tech Rings -->
    <g class="core-spin">
      <circle cx="940" cy="180" r="85" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="12, 16, 40, 20" opacity="0.4" />
      <circle cx="940" cy="180" r="115" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="6, 24, 30, 8" opacity="0.3" />
    </g>
    <g class="core-spin-rev">
      <circle cx="940" cy="180" r="60" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="18, 30, 8, 12" opacity="0.5" />
      <circle cx="940" cy="180" r="140" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-dasharray="4, 18, 60, 14" opacity="0.25" />
    </g>

    <!-- Graph Edges / Connections with animated pulse -->
    <g stroke-linecap="round">
      <!-- Static back connection lines -->
      <line x1="940" y1="180" x2="800" y2="100" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="940" y1="180" x2="820" y2="265" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="940" y1="180" x2="1070" y2="110" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="940" y1="180" x2="1090" y2="245" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="800" y1="100" x2="710" y2="160" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="820" y1="265" x2="710" y2="160" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="1070" y1="110" x2="1140" y2="185" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="1090" y1="245" x2="1140" y2="185" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="800" y1="100" x2="920" y2="60" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="1070" y1="110" x2="920" y2="60" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="820" y1="265" x2="970" y2="305" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
      <line x1="1090" y1="245" x2="970" y2="305" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

      <!-- Animated Glowing Data Flow Streamers -->
      <line class="dash-flow" x1="940" y1="180" x2="800" y2="100" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)" opacity="0.9"/>
      <line class="dash-flow-rev" x1="940" y1="180" x2="820" y2="265" stroke="#a855f7" stroke-width="2" filter="url(#softGlow)" opacity="0.9"/>
      <line class="dash-flow" x1="940" y1="180" x2="1070" y2="110" stroke="#c084fc" stroke-width="2" filter="url(#softGlow)" opacity="0.9"/>
      <line class="dash-flow-rev" x1="940" y1="180" x2="1090" y2="245" stroke="#00f0ff" stroke-width="2" filter="url(#softGlow)" opacity="0.9"/>
      <line class="dash-flow" x1="800" y1="100" x2="710" y2="160" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
      <line class="dash-flow-rev" x1="1070" y1="110" x2="1140" y2="185" stroke="#818cf8" stroke-width="1.5" opacity="0.8"/>
      <line class="dash-flow" x1="820" y1="265" x2="970" y2="305" stroke="#10b981" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Graph Orbiting Packets (SMIL animations) -->
    <circle r="3.5" fill="#38bdf8" filter="url(#softGlow)">
      <animateMotion path="M 940 180 L 800 100 L 710 160 L 820 265 L 940 180" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#c084fc" filter="url(#softGlow)">
      <animateMotion path="M 940 180 L 1070 110 L 1140 185 L 1090 245 L 940 180" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#34d399" filter="url(#softGlow)">
      <animateMotion path="M 940 180 L 970 305 L 820 265 L 710 160" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#f472b6" filter="url(#softGlow)">
      <animateMotion path="M 940 180 L 920 60 L 1070 110" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Graph Nodes -->
    <!-- Central Node: Knowledge Core -->
    <g filter="url(#glow)">
      <circle cx="940" cy="180" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="2.5" />
      <circle cx="940" cy="180" r="18" fill="#312e81" stroke="#00f0ff" stroke-width="1.5" />
      <path d="M 932 173 L 948 173 L 940 189 Z" fill="none" stroke="#38bdf8" stroke-width="1.75"/>
      <circle cx="940" cy="180" r="3" fill="#ffffff" />
    </g>

    <!-- Node 1: Class (Top Left) -->
    <g class="float-node-1">
      <g filter="url(#softGlow)">
        <rect x="755" y="78" width="86" height="34" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      </g>
      <circle cx="770" cy="95" r="4.5" fill="#38bdf8" />
      <text x="782" y="99" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Class</text>
    </g>

    <!-- Node 2: Function (Bottom Left) -->
    <g class="float-node-2">
      <g filter="url(#softGlow)">
        <rect x="765" y="248" width="105" height="34" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
      </g>
      <circle cx="782" cy="265" r="4.5" fill="#a855f7" />
      <text x="794" y="269" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">fn async()</text>
    </g>

    <!-- Node 3: Interface / AST (Top Center) -->
    <g class="float-node-3">
      <g filter="url(#softGlow)">
        <rect x="878" y="42" width="84" height="30" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
      </g>
      <circle cx="893" cy="57" r="4" fill="#818cf8" />
      <text x="904" y="61" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AST Ref</text>
    </g>

    <!-- Node 4: Dependency / Import (Top Right) -->
    <g class="float-node-2">
      <g filter="url(#softGlow)">
        <rect x="1025" y="92" width="90" height="34" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
      </g>
      <circle cx="1040" cy="109" r="4.5" fill="#c084fc" />
      <text x="1051" y="113" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">import</text>
    </g>

    <!-- Node 5: Agent Context (Bottom Right) -->
    <g class="float-node-1">
      <g filter="url(#softGlow)">
        <rect x="1040" y="228" width="98" height="34" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      </g>
      <circle cx="1055" cy="245" r="4.5" fill="#06b6d4" />
      <text x="1066" y="249" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Context</text>
    </g>

    <!-- Outer Leaf Nodes -->
    <g class="float-node-3">
      <circle cx="710" cy="160" r="15" fill="#0f172a" stroke="#10b981" stroke-width="1.5" filter="url(#softGlow)" />
      <text x="710" y="164" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
    </g>
    <g class="float-node-1">
      <circle cx="1140" cy="185" r="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
      <text x="1140" y="189" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">⚡</text>
    </g>
    <g class="float-node-2">
      <circle cx="970" cy="305" r="14" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" filter="url(#softGlow)" />
      <text x="970" y="309" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">DB</text>
    </g>
  </g>

  <!-- ==================== LEFT SIDE: TITLE, BADGES, DESCRIPTION ==================== -->
  <g id="header-content" transform="translate(60, 0)">
    
    <!-- Top Super-Badge / Category Pill -->
    <g transform="translate(0, 48)">
      <rect width="210" height="26" rx="13" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="14" cy="13" r="4" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="17" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
        AI AGENT INFRASTRUCTURE
      </text>
    </g>

    <!-- Project Icon & Title Header -->
    <g transform="translate(0, 118)">
      <!-- Animated glowing icon ring -->
      <g filter="url(#softGlow)">
        <rect x="0" y="-34" width="46" height="46" rx="12" fill="url(#cyanPurple)" fill-opacity="0.15" stroke="url(#cyanPurple)" stroke-width="1.5" />
        <text x="23" y="-5" font-size="24" text-anchor="middle">🧠</text>
      </g>
      
      <!-- Main Title -->
      <text x="60" y="-3" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
        Code Knowledge Graph
      </text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="0" y="156" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
      The Pre-Indexed Intelligence Layer for AI Agents
    </text>

    <!-- Sub-description -->
    <text x="0" y="185" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" letter-spacing="0.2">
      Instantly map symbols, AST dependencies, and call trees to supercharge agents with zero latency.
    </text>

    <!-- Feature Highlight Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: 92% Token Reduction -->
      <g transform="translate(0, 0)">
        <rect width="148" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ 92% Less Tokens</text>
      </g>

      <!-- Badge 2: 100% Local & Private -->
      <g transform="translate(158, 0)">
        <rect width="144" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="20" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🔒 100% Local Index</text>
      </g>

      <!-- Badge 3: Multi-Agent Ready -->
      <g transform="translate(312, 0)">
        <rect width="154" height="32" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="20" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🤖 MCP &amp; Agent Native</text>
      </g>
    </g>

    <!-- Terminal Prompt Preview Bar -->
    <g transform="translate(0, 276)">
      <rect width="466" height="38" rx="8" fill="#090d16" stroke="#1e293b" stroke-width="1" />
      <circle cx="16" cy="19" r="4" fill="#ef4444" opacity="0.8"/>
      <circle cx="28" cy="19" r="4" fill="#f59e0b" opacity="0.8"/>
      <circle cx="40" cy="19" r="4" fill="#10b981" opacity="0.8"/>
      <text x="56" y="23" fill="#64748b" font-family="monospace" font-size="12" font-weight="600">$</text>
      <text x="70" y="23" fill="#e2e8f0" font-family="monospace" font-size="12">npm run ckg -- index ./src</text>
      <text x="272" y="23" fill="#38bdf8" font-family="monospace" font-size="12">--graph</text>
      <!-- Cursor Blink -->
      <rect x="330" y="12" width="7" height="14" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

  </g>
</svg>
